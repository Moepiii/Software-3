<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoTax</title>
    <!-- Tailwind CSS & plugins via CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <!-- Tailwind Configuration -->
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container": "#e6eeff",
                    "secondary-fixed": "#cee9d3",
                    "secondary": "#4c6452",
                    "primary": "#012d1d",
                    "outline": "#717973",
                    "on-tertiary-fixed-variant": "#245100",
                    "on-secondary-fixed-variant": "#354c3b",
                    "tertiary-fixed": "#8bfe32",
                    "on-secondary-fixed": "#092012",
                    "secondary-container": "#cce6d0",
                    "on-tertiary-fixed": "#0b2000",
                    "on-tertiary": "#ffffff",
                    "secondary-fixed-dim": "#b3cdb7",
                    "surface-tint": "#3f6653",
                    "tertiary-fixed-dim": "#70e000",
                    "primary-fixed": "#c1ecd4",
                    "on-error-container": "#93000a",
                    "surface-container-low": "#eff4ff",
                    "primary-fixed-dim": "#a5d0b9",
                    "inverse-primary": "#a5d0b9",
                    "surface": "#f8f9ff",
                    "error-container": "#ffdad6",
                    "surface-variant": "#d5e3fd",
                    "surface-container-highest": "#d5e3fd",
                    "inverse-surface": "#233144",
                    "on-background": "#0d1c2f",
                    "on-surface-variant": "#414844",
                    "on-tertiary-container": "#5dbc00",
                    "on-surface": "#0d1c2f",
                    "on-primary-fixed-variant": "#274e3d",
                    "on-error": "#ffffff",
                    "primary-container": "#1b4332",
                    "inverse-on-surface": "#ebf1ff",
                    "outline-variant": "#c1c8c2",
                    "on-primary-fixed": "#002114",
                    "tertiary-container": "#1e4500",
                    "tertiary": "#112d00",
                    "surface-bright": "#f8f9ff",
                    "surface-container-lowest": "#ffffff",
                    "on-primary": "#ffffff",
                    "error": "#ba1a1a",
                    "surface-container-high": "#dde9ff",
                    "on-secondary-container": "#506856",
                    "background": "#f8f9ff",
                    "on-secondary": "#ffffff",
                    "on-primary-container": "#86af99",
                    "surface-dim": "#ccdbf4"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "stack-md": "16px",
                    "stack-lg": "32px",
                    "margin-mobile": "16px",
                    "container-max": "1280px",
                    "stack-sm": "8px",
                    "margin-desktop": "48px",
                    "unit": "4px",
                    "gutter": "24px"
            },
            "fontFamily": {
                    "label-bold": ["Inter"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "display-lg-mobile": ["Inter"],
                    "label-caps": ["Inter"],
                    "display-lg": ["Inter"],
                    "headline-sm": ["Inter"],
                    "body-sm": ["Inter"]
            },
            "fontSize": {
                    "label-bold": ["14px", {"lineHeight": "16px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "display-lg-mobile": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .tonal-elevation-1 {
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.04);
        }
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 24px;
        }
        .transition-active:active {
            transform: scale(0.95);
            transition-duration: 100ms;
        }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
