# Entorno aislado para validar imágenes, migraciones y pruebas de Mis Puntos.
# docker compose -p mispuntos-tests -f docker-compose.yml -f docker-compose.test.yml up --build -d
services:
  postgres:
    container_name: mispuntos-tests-postgres
    ports: !override
      - "127.0.0.1:55439:5432"
  backend:
    container_name: mispuntos-tests-backend
    ports: !override
      - "127.0.0.1:18080:8080"
  frontend:
    container_name: mispuntos-tests-frontend
    ports: !override
      - "127.0.0.1:15173:5173"
volumes:
  postgres_data:
    name: mispuntos-tests-postgres-data
